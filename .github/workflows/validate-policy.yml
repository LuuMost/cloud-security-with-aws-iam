name: Validate IAM policy

# No AWS credentials needed — validates the policy JSON locally in CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate policy JSON syntax
        run: python3 -m json.tool iam/NextWorkDevEnvironmentPolicy.json > /dev/null

      - name: Run policy checks
        run: python3 scripts/verify-policy.py
